name: tests
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: pip install rebound==5.2.2 mpmath==1.4.1 numpy==2.5.3
      - run: npm test
      - run: npm run test:ias
