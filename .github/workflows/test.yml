name: tests
on:
  push:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: pip install rebound==5.2.2 mpmath==1.4.1 numpy==2.5.3
      - run: npm test
      - run: npm run test:ias
